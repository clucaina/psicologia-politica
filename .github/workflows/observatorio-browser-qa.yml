name: Browser QA · political promises notebook
on:
  push:
    branches:
      - "feat/observatorio-promesas-auditables-20261012"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium testing runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual notebook interactions
        run: node herramientas/observatorio-promesas/tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promises-notebook-browser-qa
          path: qa-artifacts/
          retention-days: 7
