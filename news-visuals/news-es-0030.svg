<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Las emociones negativas ayudan a explicar parte del voto indeciso</title><desc>Esquema editorial sobre emociones positivas y negativas y intención de voto, basado en la ficha de European Public &amp; Social Innovation Review.</desc><rect width="1200" height="675" fill="#f1edf5"/><text x="60" y="58" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#66508a">NEWS-ES-0030 · MAPA DE EVIDENCIA</text><text x="60" y="116" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#20182d">Las emociones negativas ayudan a</text><text x="60" y="162" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#20182d">explicar parte del voto indeciso</text><path d="M60 248H1140" stroke="#20182d" stroke-width="2"/><g transform="translate(60 286)"><rect width="320" height="112" rx="10" fill="#20182d" stroke="#66508a" stroke-width="2"/><circle cx="34" cy="34" r="12" fill="#bf8c55"/><text font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f1edf5"><tspan x="60" y="34">EMOCIONES POSITIVAS Y</tspan><tspan x="60" y="52">NEGATIVAS</tspan></text><text x="26" y="88" font-family="Arial,sans-serif" font-size="17" fill="#f1edf5">PSICOLOGÍA</text></g><g transform="translate(420 286)"><rect width="320" height="112" rx="10" fill="#f1edf5" stroke="#66508a" stroke-width="2"/><circle cx="34" cy="34" r="12" fill="#66508a"/><text font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#20182d"><tspan x="60" y="34">INTENCIÓN DE VOTO</tspan></text><text x="26" y="88" font-family="Arial,sans-serif" font-size="17" fill="#20182d">POLÍTICA</text></g><g transform="translate(780 286)"><rect width="320" height="112" rx="10" fill="#f1edf5" stroke="#66508a" stroke-width="2"/><circle cx="34" cy="34" r="12" fill="#66508a"/><text font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#20182d"><tspan x="60" y="34">PAPER ACADÉMICO</tspan></text><text x="26" y="88" font-family="Arial,sans-serif" font-size="17" fill="#20182d">EVIDENCIA</text></g><rect x="60" y="430" width="1080" height="146" rx="10" fill="#ffffff" stroke="#20182d" stroke-width="2"/><text x="88" y="470" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#66508a">BASE DECLARADA</text><text x="88" y="512" font-family="Georgia,serif" font-size="26" font-weight="700" fill="#20182d">Muestra o material analizado</text><text x="618" y="453" font-family="Arial,sans-serif" font-size="21" fill="#20182d">encuesta a 395 personas que se</text><text x="618" y="481" font-family="Arial,sans-serif" font-size="21" fill="#20182d">declaraban indecisas</text><path d="M60 615H1140" stroke="#20182d" stroke-width="2"/><text x="60" y="648" font-family="Arial,sans-serif" font-size="18" fill="#20182d">Fuente enlazada: European Public &amp; Social Innovation Review · Esquema editorial propio</text></svg>
